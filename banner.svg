<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="220" viewBox="0 0 1000 220" role="img" aria-label="Sajid Ali Khan - Full Stack Software Engineer" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0e75b6"/>
      <stop offset="100%" stop-color="#6a11cb"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="round"><rect width="1000" height="220" rx="16"/></clipPath>
  </defs>

  <g clip-path="url(#round)">
    <rect width="1000" height="220" fill="url(#bg)"/>
    <circle cx="900" cy="30" r="130" fill="#ffffff" opacity="0.07"/>
    <circle cx="80" cy="210" r="110" fill="#ffffff" opacity="0.06"/>
    <rect x="-300" y="0" width="300" height="220" fill="url(#shine)">
      <animate attributeName="x" from="-300" to="1000" dur="5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <text x="500" y="100" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" fill="#ffffff">Sajid Ali Khan
    <animate attributeName="opacity" from="0" to="1" dur="1.2s" fill="freeze"/>
  </text>
  <text x="500" y="145" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="22" fill="#e8f1ff">Full Stack Software Engineer  |  Flutter &amp; MERN  |  Pakistan
    <animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="1.2s" fill="freeze"/>
  </text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
